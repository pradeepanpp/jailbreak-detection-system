# configs/detection_config.yaml
# Single source of truth for model settings, layer weights and thresholds.
# RiskEngine reads `weights` and `thresholds`; training reads `model`.

model:
  classifier: "distilbert-base-uncased"
  embedding: "all-mpnet-base-v2"
  max_length: 512          # long inputs keep the first 128 + last 382 tokens
  batch_size: 16
  num_epochs: 20           # early stopping (patience 2) usually ends sooner
  learning_rate: 2.0e-5

# Weighted contribution of each layer to the final risk score (sum = 1.0)
weights:
  rule_engine: 0.40
  ml_classifier: 0.35
  embedding_matcher: 0.25

# Final risk score thresholds
thresholds:
  block: 0.65
  monitor: 0.35

paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  models: "models"
  results: "data/results"

labels:
  benign: 0
  direct_jailbreak: 1
  prompt_injection: 2
  roleplay_hijack: 3
  encoding_attack: 4
  manyshot: 5
  indirect_injection: 6

api:
  host: "0.0.0.0"
  port: 8000
