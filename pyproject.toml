[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
# Real-bug checks: syntax errors, undefined names, unused imports/variables,
# and mutable / call defaults in function signatures.
select = ["E4", "E7", "E9", "F", "B006", "B008"]
ignore = ["E402"]   # scripts add the project root to sys.path before importing

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
