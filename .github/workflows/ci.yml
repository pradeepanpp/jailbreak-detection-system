name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.8
      - run: ruff check .

  test:
    # Model-free suite: no PyTorch, no trained models.
    # Model-based tests are skipped automatically (see tests/conftest.py).
    runs-on: ubuntu-latest
    env:
      LOG_TO_FILE: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: pytest -q

  docker:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build API image
        run: docker build -t jailbreak-api -f Dockerfile .
      - name: Build dashboard image
        run: docker build -t jailbreak-dashboard -f Dockerfile.dashboard .
